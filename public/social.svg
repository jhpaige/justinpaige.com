<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07070b"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>

    <!-- Purple glow -->
    <radialGradient id="glow-purple" cx="30%" cy="35%" r="55%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal glow -->
    <radialGradient id="glow-teal" cx="80%" cy="20%" r="45%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2de2e6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2de2e6" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent pill gradient -->
    <linearGradient id="pill-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#2de2e6"/>
    </linearGradient>

    <!-- Card border gradient -->
    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(124,92,255,0.55)"/>
      <stop offset="50%" stop-color="rgba(45,226,230,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.045" stroke="white" stroke-width="1">
    <line x1="0" y1="56" x2="1200" y2="56"/>
    <line x1="0" y1="112" x2="1200" y2="112"/>
    <line x1="0" y1="168" x2="1200" y2="168"/>
    <line x1="0" y1="224" x2="1200" y2="224"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="336" x2="1200" y2="336"/>
    <line x1="0" y1="392" x2="1200" y2="392"/>
    <line x1="0" y1="448" x2="1200" y2="448"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="56" y1="0" x2="56" y2="630"/>
    <line x1="112" y1="0" x2="112" y2="630"/>
    <line x1="168" y1="0" x2="168" y2="630"/>
    <line x1="224" y1="0" x2="224" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="336" y1="0" x2="336" y2="630"/>
    <line x1="392" y1="0" x2="392" y2="630"/>
    <line x1="448" y1="0" x2="448" y2="630"/>
    <line x1="504" y1="0" x2="504" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="616" y1="0" x2="616" y2="630"/>
    <line x1="672" y1="0" x2="672" y2="630"/>
    <line x1="728" y1="0" x2="728" y2="630"/>
    <line x1="784" y1="0" x2="784" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="896" y1="0" x2="896" y2="630"/>
    <line x1="952" y1="0" x2="952" y2="630"/>
    <line x1="1008" y1="0" x2="1008" y2="630"/>
    <line x1="1064" y1="0" x2="1064" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1176" y1="0" x2="1176" y2="630"/>
  </g>

  <!-- Glow layers -->
  <rect width="1200" height="630" fill="url(#glow-purple)"/>
  <rect width="1200" height="630" fill="url(#glow-teal)"/>

  <!-- Left content -->
  <!-- Eyebrow label -->
  <text x="80" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" letter-spacing="3" fill="white" opacity="0.55" text-anchor="start">SENIOR SOFTWARE ENGINEER</text>

  <!-- Name -->
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" opacity="0.96" letter-spacing="-1.5">Justin Paige</text>

  <!-- Tagline -->
  <text x="80" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="white" opacity="0.60">Designing and building scalable products</text>
  <text x="80" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="white" opacity="0.60">from interface to infrastructure.</text>

  <!-- Divider -->
  <rect x="80" y="418" width="480" height="1" fill="url(#pill-grad)" opacity="0.3"/>

  <!-- LinkedIn row -->
  <!-- Icon (15×15 viewBox scaled to 22×22, translated to row position) -->
  <g transform="translate(80, 438) scale(1.46667)">
    <path d="M2 1C1.44772 1 1 1.44772 1 2V13C1 13.5523 1.44772 14 2 14H13C13.5523 14 14 13.5523 14 13V2C14 1.44772 13.5523 1 13 1H2ZM3.05 6H4.95V12H3.05V6ZM5.075 4.005C5.075 4.59871 4.59371 5.08 4 5.08C3.4063 5.08 2.925 4.59871 2.925 4.005C2.925 3.41129 3.4063 2.93 4 2.93C4.59371 2.93 5.075 3.41129 5.075 4.005ZM12 8.35713C12 6.55208 10.8334 5.85033 9.67449 5.85033C9.29502 5.83163 8.91721 5.91119 8.57874 6.08107C8.32172 6.21007 8.05265 6.50523 7.84516 7.01853H7.79179V6.00044H6V12.0047H7.90616V8.8112C7.8786 8.48413 7.98327 8.06142 8.19741 7.80987C8.41156 7.55832 8.71789 7.49825 8.95015 7.46774H9.02258C9.62874 7.46774 10.0786 7.84301 10.0786 8.78868V12.0047H11.9847L12 8.35713Z" fill="white" fill-rule="evenodd" clip-rule="evenodd" opacity="0.7"/>
  </g>
  <text x="114" y="457" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="white" opacity="0.65">linkedin.com/in/justin-paige</text>

  <!-- Email row -->
  <g transform="translate(80, 474) scale(1.46667)">
    <path d="M1 2C0.447715 2 0 2.44772 0 3V12C0 12.5523 0.447715 13 1 13H14C14.5523 13 15 12.5523 15 12V3C15 2.44772 14.5523 2 14 2H1ZM1 3L14 3V3.92494C13.9174 3.92486 13.8338 3.94751 13.7589 3.99505L7.5 7.96703L1.24112 3.99505C1.16621 3.94751 1.0826 3.92486 1 3.92494V3ZM1 4.90797V12H14V4.90797L7.74112 8.87995C7.59394 8.97335 7.40606 8.97335 7.25888 8.87995L1 4.90797Z" fill="white" fill-rule="evenodd" clip-rule="evenodd" opacity="0.7"/>
  </g>
  <text x="114" y="493" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="white" opacity="0.65">justinpaige3@gmail.com</text>

  <!-- Right card -->
  <!-- Card border (rounded rect via path approximation - use rect with rx) -->
  <rect x="740" y="155" width="380" height="320" rx="26" fill="rgba(124,92,255,0.55)" opacity="0.55"/>
  <rect x="741" y="156" width="378" height="318" rx="25" fill="#08080c" opacity="0.85"/>

  <!-- Card inner content -->
  <!-- "Now" pill -->
  <rect x="764" y="182" width="52" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="790" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="white" opacity="0.82" text-anchor="middle">Now</text>

  <!-- Company -->
  <text x="1096" y="201" font-family="ui-monospace, monospace" font-size="13" fill="white" opacity="0.55" text-anchor="end">DraftKings • NYC</text>

  <!-- Card item 1 -->
  <rect x="764" y="222" width="336" height="68" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="784" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="white" opacity="0.92">Platform Integration</text>
  <text x="784" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="white" opacity="0.60">Railbird Exchange → DraftKings</text>

  <!-- Card item 2 -->
  <rect x="764" y="300" width="336" height="68" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="784" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="white" opacity="0.92">Frontend Systems</text>
  <text x="784" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="white" opacity="0.60">React, SvelteKit, UI infrastructure</text>

  <!-- Card item 3 -->
  <rect x="764" y="378" width="336" height="68" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="784" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="white" opacity="0.92">Full Stack</text>
  <text x="784" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="white" opacity="0.60">APIs, data mapping, operational alignment</text>

  <!-- Bottom domain watermark -->
  <text x="600" y="582" font-family="ui-monospace, monospace" font-size="14" fill="white" opacity="0.25" text-anchor="middle" letter-spacing="2">justinpaige.com</text>
</svg>
